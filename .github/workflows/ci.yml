name: Node.js CI

on: [push]

env:
  DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
  SKIP_DB_CHECK: 1

jobs:
  # Build + boot smoke-check.
  #
  # A green `next build` is NOT sufficient: app-router route collisions — two
  # dynamic siblings for the same path, e.g. share/[slug] vs share/[...shareId]
  # — build clean and only throw at SERVER BOOT. That is exactly how 3.0.8
  # shipped: the Docker build was green but the pod CrashLoopBackOff'd on
  # startup. This job boots the standalone server the same way prod does
  # (node .next/standalone/server.js, per Dockerfile) and requires a live
  # /api/heartbeat 200 — so a boot crash reds the lane before release.
  build:
    if: github.repository == 'hanzoai/analytics'
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm build
      - name: Boot smoke-check (/api/heartbeat must return 200)
        env:
          APP_SECRET: ci-smoke-secret
          PORT: "3000"
          HOSTNAME: 127.0.0.1
        run: |
          node .next/standalone/server.js > boot.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/heartbeat || true)
            if [ "$code" = "200" ]; then
              echo "✓ server booted; /api/heartbeat returned 200"
              exit 0
            fi
            sleep 1
          done
          echo "✗ server never served /api/heartbeat 200 within 30s (boot crash?)"
          cat boot.log
          exit 1

  # Unit tests (jest).
  #
  # Known-red and tracked separately from the 3.0.9 boot fix: the repo is
  # mid jest→vitest migration — 7 suites `import { ... } from 'vitest'` (not
  # installed) and the .tsx suite needs jsdom + @testing-library (also absent).
  # Greening it means adding the vitest/jsdom dev-deps + regenerating the pnpm
  # lockfile, so it is deliberately NOT bundled into the route-collision fix.
  test:
    if: github.repository == 'hanzoai/analytics'
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm test
