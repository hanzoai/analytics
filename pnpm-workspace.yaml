packages:
  - '**'
# Transcribed from the onlyBuiltDependencies / ignoredBuiltDependencies lists
# below, which say the same thing in the keys pnpm read before 11.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  cypress: false
  esbuild: false
  sharp: false
ignoredBuiltDependencies:
  - cypress
  - esbuild
  - sharp
minimumReleaseAgeExclude:
  - '@hanzo/logo@1.0.23'
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma

